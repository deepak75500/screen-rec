
[project]
name = "screen-rec"
version = "0.1.0"
description = "Flask screen recording application for Cloudflare Workers"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "python-dotenv==1.0.1",
    "google-api-python-client==2.140.0",
    "google-auth==2.34.0",
    "google-auth-oauthlib==1.2.1",
    "google-auth-httplib2==0.2.0",
    "requests==2.32.3",
    "supabase",
    "cryptography",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
